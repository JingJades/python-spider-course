<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kimi K3 Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .header {
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 600;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .api-key-section {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .api-key-input {
            padding: 8px 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 14px;
            width: 250px;
            outline: none;
            transition: border-color 0.3s;
        }
        .api-key-input:focus {
            border-color: #667eea;
        }
        .api-key-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        .save-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .save-btn:hover {
            opacity: 0.9;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 15px 20px;
            border-radius: 16px;
            line-height: 1.6;
            font-size: 15px;
        }
        .user-message {
            align-self: flex-end;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-bottom-right-radius: 4px;
        }
        .assistant-message {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.1);
            border-bottom-left-radius: 4px;
        }
        .system-message {
            align-self: center;
            background: rgba(255, 255, 255, 0.05);
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            padding: 8px 16px;
            border-radius: 20px;
        }
        .input-container {
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 10px;
        }
        .message-input {
            flex: 1;
            padding: 15px 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
            resize: none;
            max-height: 200px;
        }
        .message-input:focus {
            border-color: #667eea;
        }
        .message-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        .send-btn {
            padding: 15px 30px;
            border: none;
            border-radius: 24px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            font-size: 15px;
            cursor: pointer;
            transition: opacity 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .send-btn:hover {
            opacity: 0.9;
        }
        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 15px 20px;
        }
        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            animation: typing 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        .model-selector {
            padding: 8px 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }
        .model-selector option {
            background: #1a1a2e;
            color: #fff;
        }
        .header-right {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .error-message {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }
        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                gap: 15px;
            }
            .api-key-section {
                width: 100%;
            }
            .api-key-input {
                flex: 1;
            }
            .message {
                max-width: 95%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div style="display: flex; align-items: center; gap: 20px;">
                <h1>Kimi K3 Chat</h1>
                <div style="display: flex; gap: 15px;">
                    <a href="promo.html" style="color: #999; text-decoration: none; font-size: 14px; transition: color 0.3s;" onmouseover="this.style.color='#667eea'" onmouseout="this.style.color='#999'">爬虫课程宣传</a>
                    <a href="spider-course.html" style="color: #999; text-decoration: none; font-size: 14px; transition: color 0.3s;" onmouseover="this.style.color='#667eea'" onmouseout="this.style.color='#999'">爬虫课程学习</a>
                </div>
            </div>
            <div class="header-right">
                <select class="model-selector" id="modelSelector">
                    <option value="kimi-k3">Kimi K3</option>
                    <option value="kimi-k2.7-code-highspeed">Kimi K2.7 Code</option>
                    <option value="kimi-k2.6">Kimi K2.6</option>
                </select>
                <div class="api-key-section">
                    <input type="password" class="api-key-input" id="apiKeyInput" placeholder="输入 Kimi API Key">
                    <button class="save-btn" id="saveKeyBtn">保存</button>
                </div>
            </div>
        </div>
        
        <div class="chat-container" id="chatContainer">
            <div class="system-message">欢迎使用 Kimi K3！请先输入您的 API Key 开始对话。</div>
        </div>
        
        <div class="input-container">
            <textarea class="message-input" id="messageInput" placeholder="输入消息..." rows="1"></textarea>
            <button class="send-btn" id="sendBtn">发送</button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const saveKeyBtn = document.getElementById('saveKeyBtn');
        const modelSelector = document.getElementById('modelSelector');

        let apiKey = localStorage.getItem('kimiApiKey') || '';
        let isSending = false;

        apiKeyInput.value = apiKey;

        saveKeyBtn.addEventListener('click', () => {
            apiKey = apiKeyInput.value.trim();
            localStorage.setItem('kimiApiKey', apiKey);
            addSystemMessage('API Key 已保存！');
        });

        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);

        function addMessage(content, role) {
            const div = document.createElement('div');
            div.className = `${role}-message message`;
            div.innerHTML = content.replace(/\n/g, '<br>');
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function addSystemMessage(content) {
            const div = document.createElement('div');
            div.className = 'system-message';
            div.textContent = content;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function showTyping() {
            const div = document.createElement('div');
            div.className = 'assistant-message message';
            div.id = 'typingIndicator';
            div.innerHTML = '<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }

        async function sendMessage() {
            const content = messageInput.value.trim();
            if (!content || isSending) return;

            if (!apiKey) {
                addSystemMessage('请先输入并保存 API Key！');
                return;
            }

            isSending = true;
            sendBtn.disabled = true;
            messageInput.value = '';
            messageInput.style.height = 'auto';

            addMessage(content, 'user');
            showTyping();

            try {
                const response = await fetch('/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: modelSelector.value,
                        messages: [
                            { role: 'system', content: '你是 Kimi，一个由 Moonshot AI 提供的智能助手。' },
                            { role: 'user', content: content }
                        ],
                        stream: true,
                        reasoning_effort: 'max'
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    removeTyping();
                    addMessage(`❌ 错误: ${error.error || '未知错误'}`, 'error');
                    isSending = false;
                    sendBtn.disabled = false;
                    return;
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let assistantContent = '';
                let messageDiv = null;

                removeTyping();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunks = decoder.decode(value).split('\n');
                    for (const chunk of chunks) {
                        if (chunk.startsWith('data: ')) {
                            const data = chunk.slice(6);
                            if (data === '[DONE]') continue;
                            
                            try {
                                const json = JSON.parse(data);
                                const text = json.choices[0]?.delta?.content || '';
                                if (text) {
                                    assistantContent += text;
                                    if (!messageDiv) {
                                        messageDiv = document.createElement('div');
                                        messageDiv.className = 'assistant-message message';
                                        chatContainer.appendChild(messageDiv);
                                    }
                                    messageDiv.innerHTML = assistantContent.replace(/\n/g, '<br>');
                                    chatContainer.scrollTop = chatContainer.scrollHeight;
                                }
                            } catch (e) {
                                continue;
                            }
                        }
                    }
                }
            } catch (error) {
                removeTyping();
                addMessage(`❌ 连接错误: ${error.message}`, 'error');
            } finally {
                isSending = false;
                sendBtn.disabled = false;
            }
        }

        messageInput.addEventListener('input', () => {
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 200) + 'px';
        });
    </script>
</body>
</html>

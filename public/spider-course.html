<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python爬虫入门到实战 - 新手引导课程</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            padding-top: 56px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0f0f0f;
            color: #fff;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #00a1d6 0%, #00c3ff 100%);
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0, 161, 214, 0.3);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .header-logo {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
        }
        .header-title {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
        }
        .header-right {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .btn {
            padding: 10px 24px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.3s;
        }
        .btn-primary {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            backdrop-filter: blur(10px);
        }
        .btn-primary:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .btn-action {
            background: #ff6b35;
            color: #fff;
        }
        .btn-action:hover {
            background: #ff8552;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.4);
        }
        .main-container {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            gap: 20px;
        }
        .video-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .video-player {
            background: #1a1a1a;
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 16/9;
            position: relative;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .video-player img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .video-overlay:hover {
            background: rgba(0, 0, 0, 0.5);
        }
        .play-btn {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s;
        }
        .play-btn:hover {
            transform: scale(1.1);
        }
        .play-btn svg {
            width: 32px;
            height: 32px;
            fill: #00a1d6;
            margin-left: 6px;
        }
        .video-title {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            padding: 0 10px;
        }
        .video-info {
            display: flex;
            gap: 20px;
            padding: 0 10px;
            color: #999;
            font-size: 13px;
        }
        .video-controls {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .progress-bar {
            flex: 1;
            height: 6px;
            background: #333;
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00a1d6, #00c3ff);
            border-radius: 3px;
            width: 30%;
        }
        .time-display {
            font-size: 13px;
            color: #999;
            min-width: 100px;
        }
        .control-btn {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.3s;
        }
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .control-btn svg {
            width: 18px;
            height: 18px;
            fill: #fff;
        }
        .sidebar {
            width: 360px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .course-card {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .course-cover {
            height: 180px;
            position: relative;
        }
        .course-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .course-cover-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
        }
        .course-info {
            padding: 20px;
        }
        .course-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #fff;
        }
        .course-desc {
            font-size: 14px;
            color: #999;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .course-stats {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #999;
            font-size: 13px;
        }
        .stat-item svg {
            width: 16px;
            height: 16px;
            fill: #00a1d6;
        }
        .course-teacher {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .teacher-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #00a1d6, #00c3ff);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
        }
        .teacher-info {
            flex: 1;
        }
        .teacher-name {
            font-size: 14px;
            font-weight: 500;
            color: #fff;
        }
        .teacher-title {
            font-size: 12px;
            color: #999;
        }
        .chapter-list {
            background: #1a1a1a;
            border-radius: 16px;
            overflow: hidden;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .chapter-header {
            padding: 15px 20px;
            background: rgba(0, 161, 214, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .chapter-header h3 {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }
        .chapter-count {
            font-size: 12px;
            color: #999;
        }
        .chapter-items {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .chapter-item {
            margin-bottom: 10px;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.05);
        }
        .chapter-title-bar {
            padding: 12px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: background 0.3s;
        }
        .chapter-title-bar:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .chapter-title-bar.active {
            background: rgba(0, 161, 214, 0.2);
        }
        .chapter-title {
            font-size: 14px;
            font-weight: 500;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chapter-title-number {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #00a1d6, #00c3ff);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
        }
        .chapter-duration {
            font-size: 12px;
            color: #999;
        }
        .chapter-arrow {
            font-size: 12px;
            color: #999;
            transition: transform 0.3s;
        }
        .chapter-title-bar.active .chapter-arrow {
            transform: rotate(90deg);
        }
        .lesson-list {
            display: none;
            padding: 5px 0;
            background: rgba(0, 0, 0, 0.2);
        }
        .chapter-item.active .lesson-list {
            display: block;
        }
        .lesson-item {
            padding: 10px 15px 10px 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: background 0.3s;
            border-left: 3px solid transparent;
        }
        .lesson-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .lesson-item.active {
            background: rgba(0, 161, 214, 0.15);
            border-left-color: #00a1d6;
        }
        .lesson-title {
            font-size: 13px;
            color: #e0e0e0;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .lesson-duration {
            font-size: 12px;
            color: #666;
            margin-left: 10px;
        }
        .lesson-play-icon {
            width: 28px;
            height: 28px;
            background: rgba(0, 161, 214, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 10px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .lesson-item:hover .lesson-play-icon {
            opacity: 1;
        }
        .lesson-play-icon svg {
            width: 12px;
            height: 12px;
            fill: #00a1d6;
            margin-left: 2px;
        }
        .knowledge-panel {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
        }
        .knowledge-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .knowledge-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #5856d6, #af52de);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .knowledge-title {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
        }
        .knowledge-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }
        .knowledge-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            transition: transform 0.3s, background 0.3s;
            cursor: pointer;
        }
        .knowledge-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }
        .knowledge-card-title {
            font-size: 14px;
            font-weight: 500;
            color: #fff;
            margin-bottom: 8px;
        }
        .knowledge-card-content {
            font-size: 13px;
            color: #999;
            line-height: 1.5;
        }
        .knowledge-card-tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 11px;
            margin-bottom: 10px;
        }
        .tag-summary {
            background: rgba(0, 161, 214, 0.2);
            color: #00c3ff;
        }
        .tag-tip {
            background: rgba(255, 107, 53, 0.2);
            color: #ff8552;
        }
        .tag-comparison {
            background: rgba(52, 211, 153, 0.2);
            color: #34d399;
        }
        .detail-panel {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }
        .detail-panel.active {
            display: block;
        }
        .detail-title {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .detail-close {
            font-size: 14px;
            color: #999;
            cursor: pointer;
            margin-left: auto;
        }
        .detail-close:hover {
            color: #fff;
        }
        .knowledge-item {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .knowledge-item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }
        .knowledge-item-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .knowledge-item-type {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .type-definition {
            background: rgba(92, 132, 255, 0.2);
            color: #5c84ff;
        }
        .type-concept {
            background: rgba(0, 161, 214, 0.2);
            color: #00c3ff;
        }
        .type-note {
            background: rgba(255, 107, 53, 0.2);
            color: #ff8552;
        }
        .type-code {
            background: rgba(52, 211, 153, 0.2);
            color: #34d399;
        }
        .type-reference {
            background: rgba(168, 85, 247, 0.2);
            color: #a855f7;
        }
        .type-structure {
            background: rgba(251, 146, 60, 0.2);
            color: #fb923c;
        }
        .type-tool {
            background: rgba(139, 92, 246, 0.2);
            color: #8b5cf6;
        }
        .knowledge-item-title {
            font-size: 14px;
            font-weight: 500;
            color: #fff;
        }
        .knowledge-item-content {
            font-size: 14px;
            color: #e0e0e0;
            line-height: 1.6;
            padding-left: 15px;
        }
        .knowledge-item-content code {
            background: rgba(0, 0, 0, 0.4);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'Consolas', monospace;
            font-size: 13px;
            color: #34d399;
        }
        .code-block {
            background: #0d0d0d;
            border-radius: 8px;
            padding: 15px;
            overflow-x: auto;
            font-family: 'Consolas', monospace;
            font-size: 13px;
            color: #e0e0e0;
            line-height: 1.6;
        }
        .code-block pre {
            margin: 0;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .code-block code {
            background: none !important;
            padding: 0 !important;
            color: inherit !important;
        }
        .footer {
            background: #1a1a1a;
            padding: 30px 40px;
            margin-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .footer-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .footer-links {
            display: flex;
            gap: 20px;
        }
        .footer-links a {
            color: #999;
            font-size: 13px;
            text-decoration: none;
            transition: color 0.3s;
        }
        .footer-links a:hover {
            color: #00a1d6;
        }
        .footer-copyright {
            color: #666;
            font-size: 13px;
        }
        @media (max-width: 1024px) {
            .main-container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
            }
        }
        @media (max-width: 600px) {
            .header {
                padding: 15px 20px;
            }
            .header-title {
                font-size: 16px;
            }
            .btn {
                padding: 8px 16px;
                font-size: 12px;
            }
            .video-info {
                flex-wrap: wrap;
                gap: 10px;
            }
        }
    
        /* ===== 全局顶部导航 ===== */
        .topbar{position:fixed;top:0;left:0;right:0;height:56px;z-index:1000;
        display:flex;align-items:center;gap:14px;padding:0 22px;
        background:rgba(11,13,18,.88);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.08)}
        .topbar .logo{font-weight:700;font-size:15px;white-space:nowrap;text-decoration:none;
        background:linear-gradient(90deg,#00c3ff,#8b8cf8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
        .topnav{display:flex;gap:2px;margin:0 auto}
        .topnav a{padding:6px 14px;border-radius:8px;font-size:13.5px;color:#9aa0a6;white-space:nowrap;transition:.2s;text-decoration:none}
        .topnav a:hover{color:#fff;background:rgba(255,255,255,.07)}
        .topnav a.active{color:#fff;background:linear-gradient(90deg,rgba(0,161,214,.35),rgba(88,86,214,.35))}
        @media(max-width:640px){.topnav a{padding:6px 9px;font-size:12.5px}}
        /* ===== 讲义内容样式 ===== */
        .lecture-body{margin-bottom:10px}
        .lecture-header{font-size:16px;font-weight:700;color:#fff;margin-bottom:14px;
        padding:10px 16px;border-radius:10px;background:linear-gradient(90deg,rgba(0,161,214,.25),rgba(88,86,214,.25))}
        .lecture-body h2{font-size:19px;margin:8px 0 14px;color:#fff;padding-left:11px;
        border-left:4px solid #00a1d6;line-height:1.4}
        .lecture-body h3{font-size:16px;margin:24px 0 10px;color:#00c3ff}
        .lecture-body p{margin:11px 0;color:#dfe3ea;font-size:14.5px;line-height:1.85}
        .lecture-body ul,.lecture-body ol{margin:11px 0 11px 22px;color:#dfe3ea;font-size:14.5px}
        .lecture-body li{margin:6px 0;line-height:1.8}
        .lecture-body strong{color:#fff}
        .lecture-body blockquote{margin:14px 0;padding:12px 16px;border-radius:0 10px 10px 0;
        background:linear-gradient(135deg,rgba(0,161,214,.09),rgba(88,86,214,.09));
        border-left:4px solid #5856d6;color:#9aa0a6;font-size:14px}
        .lecture-body table{border-collapse:collapse;width:100%;margin:14px 0;font-size:13.5px;display:block;overflow-x:auto}
        .lecture-body th,.lecture-body td{border:1px solid rgba(255,255,255,.1);padding:8px 13px;text-align:left;white-space:nowrap}
        .lecture-body th{background:linear-gradient(90deg,rgba(0,161,214,.22),rgba(88,86,214,.22));color:#fff}
        .lecture-body tr:nth-child(even){background:rgba(255,255,255,.02)}
        .lecture-body code{font-family:Consolas,Monaco,monospace;font-size:.9em;
        background:rgba(0,161,214,.13);color:#7dd3fc;padding:2px 7px;border-radius:6px}
        .lecture-body pre{margin:14px 0;border-radius:12px;overflow-x:auto;
        border:1px solid rgba(255,255,255,.08);background:#0d1117}
        .lecture-body pre code{display:block;padding:16px 18px;background:transparent;
        color:#e6edf3;font-size:13px;line-height:1.75}
        .lecture-body .codehilite{background:#0d1117 !important;border-radius:12px;
        border:1px solid rgba(255,255,255,.08);margin:14px 0;overflow-x:auto}
        .lecture-body .codehilite pre{margin:0;border:none;background:transparent}
        .lecture-body hr{border:none;height:1px;background:rgba(255,255,255,.08);margin:26px 0}
        .knowledge-divider{font-size:16px;font-weight:700;color:#fff;margin:30px 0 16px;
        padding:10px 16px;border-radius:10px;background:linear-gradient(90deg,rgba(52,211,153,.18),rgba(0,161,214,.18))}
pre { line-height: 125%; }
td.linenos .normal { color: inherit; background-color: transparent; padding-left: 5px; padding-right: 5px; }
span.linenos { color: inherit; background-color: transparent; padding-left: 5px; padding-right: 5px; }
td.linenos .special { color: #000000; background-color: #ffffc0; padding-left: 5px; padding-right: 5px; }
span.linenos.special { color: #000000; background-color: #ffffc0; padding-left: 5px; padding-right: 5px; }
.codehilite .hll { background-color: #49483e }
.codehilite { background: #272822; color: #F8F8F2 }
.codehilite .c { color: #959077 } /* Comment */
.codehilite .err { color: #ED007E; background-color: #1E0010 } /* Error */
.codehilite .esc { color: #F8F8F2 } /* Escape */
.codehilite .g { color: #F8F8F2 } /* Generic */
.codehilite .k { color: #66D9EF } /* Keyword */
.codehilite .l { color: #AE81FF } /* Literal */
.codehilite .n { color: #F8F8F2 } /* Name */
.codehilite .o { color: #FF4689 } /* Operator */
.codehilite .x { color: #F8F8F2 } /* Other */
.codehilite .p { color: #F8F8F2 } /* Punctuation */
.codehilite .ch { color: #959077 } /* Comment.Hashbang */
.codehilite .cm { color: #959077 } /* Comment.Multiline */
.codehilite .cp { color: #959077 } /* Comment.Preproc */
.codehilite .cpf { color: #959077 } /* Comment.PreprocFile */
.codehilite .c1 { color: #959077 } /* Comment.Single */
.codehilite .cs { color: #959077 } /* Comment.Special */
.codehilite .gd { color: #FF4689 } /* Generic.Deleted */
.codehilite .ge { color: #F8F8F2; font-style: italic } /* Generic.Emph */
.codehilite .ges { color: #F8F8F2; font-weight: bold; font-style: italic } /* Generic.EmphStrong */
.codehilite .gr { color: #F8F8F2 } /* Generic.Error */
.codehilite .gh { color: #F8F8F2 } /* Generic.Heading */
.codehilite .gi { color: #A6E22E } /* Generic.Inserted */
.codehilite .go { color: #66D9EF } /* Generic.Output */

<body>
<div class="topbar">
  <a class="logo" href="/promo.html">🐍 Python爬虫入门到实战</a>
  <nav class="topnav">
    <a href="/promo.html">推广首页</a>
    <a href="/spider-course.html" class="active">视频上课</a>
    <a href="/course/index.html">完整讲义</a>
  </nav>
</div>

    <div class="main-container">
        <div class="video-section">
            <div class="video-player">
                <img id="videoThumbnail" src="" alt="视频封面">
                <div class="video-overlay" onclick="playVideo()">
                    <div class="play-btn">
                        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </div>
                    <div style="margin-top: 15px; font-size: 16px; font-weight: 500;">点击播放视频</div>
                </div>
            </div>
            <div class="video-title" id="videoTitle">请选择一个章节开始学习</div>
            <div class="video-info">
                <span>讲师：<span style="color: #00c3ff;">爬虫入门导师</span></span>
                <span>|</span>
                <span id="videoDuration">00:00</span>
                <span>|</span>
                <span>已学习：<span style="color: #34d399;">0%</span></span>
            </div>
            <div class="video-controls">
                <div class="control-btn" onclick="playPrev()">
                    <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </div>
                <div class="control-btn" onclick="togglePlay()">
                    <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </div>
                <div class="control-btn" onclick="playNext()">
                    <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
                <div class="time-display">00:00 / 00:00</div>
                <div class="control-btn" onclick="toggleFullscreen()">
                    <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                </div>
            </div>

            <div class="knowledge-panel">
                <div class="knowledge-header">
                    <div class="knowledge-icon">📚</div>
                    <div class="knowledge-title">核心知识点</div>
                </div>
                <div class="knowledge-content" id="knowledgePoints">
                </div>
            </div>

            <div class="detail-panel" id="detailPanel">
                <div class="detail-title">
                    <span>📖 知识点详情</span>
                    <span class="detail-close" onclick="closeDetail()">✕</span>
                </div>
                <div id="detailContent">
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="course-card">
                <div class="course-cover">
                    <img id="courseCover" src="" alt="课程封面">
                    <div class="course-cover-overlay"></div>
                </div>
                <div class="course-info">
                    <h2 class="course-title" id="courseTitle">Python爬虫入门到实战</h2>
                    <p class="course-desc" id="courseDesc">专为大学生设计的爬虫新手引导课程，从基础概念到实战项目，带你快速掌握Python爬虫技术</p>
                    <div class="course-stats">
                        <div class="stat-item">
                            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                            <span id="courseStudents">0</span>人学习
                        </div>
                        <div class="stat-item">
                            <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7z"/></svg>
                            <span id="courseDuration">0</span>
                        </div>
                        <div class="stat-item">
                            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                            <span id="courseLessons">0</span>节课程
                        </div>
                    </div>
                    <div class="course-teacher">
                        <div class="teacher-avatar">👨‍🏫</div>
                        <div class="teacher-info">
                            <div class="teacher-name" id="courseTeacher">爬虫入门导师</div>
                            <div class="teacher-title">资深Python开发工程师</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="chapter-list">
                <div class="chapter-header">
                    <h3>课程目录</h3>
                    <span class="chapter-count" id="chapterCount">0章</span>
                </div>
                <div class="chapter-items" id="chapterList">
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="footer-content">
            <div class="footer-links">
                <a href="#">关于我们</a>
                <a href="#">帮助中心</a>
                <a href="#">用户协议</a>
                <a href="#">隐私政策</a>
            </div>
            <div class="footer-copyright">© 2024 Python爬虫入门课程. All rights reserved.</div>
        </div>
    </div>

    <script>
        let courseData = null;
        let lectureData = null;
        let currentChapter = 0;
        let currentLesson = 0;
        let isPlaying = false;

        async function loadCourseData() {
            try {
                const [knRes, lecRes] = await Promise.all([
                    fetch('spider-knowledge.json'),
                    fetch('spider-lectures.json')
                ]);
                courseData = await knRes.json();
                lectureData = await lecRes.json();
                renderCourseInfo();
                renderChapterList();
                renderKnowledgePoints();
                selectFirstLesson();
            } catch (error) {
                console.error('加载课程数据失败:', error);
            }
        }

        function renderCourseInfo() {
            const course = courseData.course;
            document.getElementById('courseTitle').textContent = course.title;
            document.getElementById('courseDesc').textContent = course.description;
            document.getElementById('courseCover').src = course.cover;
            document.getElementById('courseTeacher').textContent = course.teacher;
            document.getElementById('courseDuration').textContent = course.duration;
            document.getElementById('courseLessons').textContent = course.lessons;
            document.getElementById('courseStudents').textContent = course.students.toLocaleString();
            document.getElementById('chapterCount').textContent = courseData.chapters.length + '章';
        }

        function renderChapterList() {
            const container = document.getElementById('chapterList');
            container.innerHTML = '';

            courseData.chapters.forEach((chapter, chapterIndex) => {
                const chapterItem = document.createElement('div');
                chapterItem.className = 'chapter-item';
                chapterItem.innerHTML = `
                    <div class="chapter-title-bar" onclick="toggleChapter(${chapterIndex})">
                        <div class="chapter-title">
                            <span class="chapter-title-number">${chapter.id}</span>
                            <span>${chapter.title}</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <span class="chapter-duration">${chapter.duration}</span>
                            <span class="chapter-arrow">▶</span>
                        </div>
                    </div>
                    <div class="lesson-list">
                        ${chapter.lessons.map((lesson, lessonIndex) => `
                            <div class="lesson-item" onclick="selectLesson(${chapterIndex}, ${lessonIndex})">
                                <span class="lesson-title">${lesson.title}</span>
                                <span class="lesson-duration">${lesson.duration}</span>
                                <div class="lesson-play-icon">
                                    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                container.appendChild(chapterItem);
            });
        }

        function toggleChapter(chapterIndex) {
            const chapters = document.querySelectorAll('.chapter-item');
            chapters[chapterIndex].classList.toggle('active');
        }

        function selectLesson(chapterIndex, lessonIndex) {
            currentChapter = chapterIndex;
            currentLesson = lessonIndex;

            document.querySelectorAll('.lesson-item').forEach(item => item.classList.remove('active'));
            const lessonItems = document.querySelectorAll('.lesson-item');
            let count = 0;
            for (let i = 0; i <= chapterIndex; i++) {
                if (i < chapterIndex) {
                    count += courseData.chapters[i].lessons.length;
                } else {
                    lessonItems[count + lessonIndex].classList.add('active');
                }
            }

            const chapter = courseData.chapters[chapterIndex];
            const lesson = chapter.lessons[lessonIndex];

            document.getElementById('videoTitle').textContent = lesson.title;
            document.getElementById('videoDuration').textContent = lesson.duration;
            document.getElementById('videoThumbnail').src = lesson.video;

            renderLecture(chapterIndex, lessonIndex);
            renderLessonKnowledge(lesson.knowledge);
            openDetail();
        }

        function selectFirstLesson() {
            document.querySelector('.chapter-item').classList.add('active');
            selectLesson(0, 0);
        }

        function renderKnowledgePoints() {
            const container = document.getElementById('knowledgePoints');
            container.innerHTML = '';

            courseData.knowledge_points.forEach(point => {
                const card = document.createElement('div');
                card.className = 'knowledge-card';
                card.onclick = () => showKnowledgeDetail(point);
                let tagClass = 'tag-summary';
                if (point.type === 'tip') tagClass = 'tag-tip';
                if (point.type === 'comparison') tagClass = 'tag-comparison';
                
                card.innerHTML = `
                    <span class="knowledge-card-tag ${tagClass}">${point.type === 'summary' ? '总结' : point.type === 'tip' ? '技巧' : '对比'}</span>
                    <div class="knowledge-card-title">${point.title}</div>
                    <div class="knowledge-card-content">${point.content}</div>
                `;
                container.appendChild(card);
            });
        }

        function renderLecture(chapterIndex, lessonIndex) {
            const container = document.getElementById('detailContent');
            container.innerHTML = '';
            const html = lectureData && lectureData[chapterIndex] && lectureData[chapterIndex][lessonIndex];
            if (!html) return;
            const wrap = document.createElement('div');
            wrap.className = 'lecture-body';
            wrap.innerHTML = '<div class="lecture-header">📖 本课完整讲义</div>' + html;
            container.appendChild(wrap);
            const divider = document.createElement('div');
            divider.className = 'knowledge-divider';
            divider.textContent = '💡 核心知识点速记';
            container.appendChild(divider);
        }

        function renderLessonKnowledge(knowledgeList) {
            const container = document.getElementById('detailContent');

            knowledgeList.forEach(item => {
                const knowledgeItem = document.createElement('div');
                knowledgeItem.className = 'knowledge-item';
                
                let typeClass = 'type-definition';
                let typeLabel = '定义';
                switch(item.type) {
                    case 'concept': typeClass = 'type-concept'; typeLabel = '概念'; break;
                    case 'note': typeClass = 'type-note'; typeLabel = '注意'; break;
                    case 'code': typeClass = 'type-code'; typeLabel = '代码'; break;
                    case 'reference': typeClass = 'type-reference'; typeLabel = '参考'; break;
                    case 'structure': typeClass = 'type-structure'; typeLabel = '结构'; break;
                    case 'tool': typeClass = 'type-tool'; typeLabel = '工具'; break;
                }

                let contentHtml = item.content;
                if (item.type === 'code') {
                    contentHtml = `<div class="code-block"><pre><code>${item.content}</code></pre></div>`;
                } else {
                    contentHtml = item.content.replace(/(\n)/g, '<br>');
                }

                knowledgeItem.innerHTML = `
                    <div class="knowledge-item-header">
                        <span class="knowledge-item-type ${typeClass}">${typeLabel}</span>
                        <span class="knowledge-item-title">${item.title}</span>
                    </div>
                    <div class="knowledge-item-content">${contentHtml}</div>
                `;
                container.appendChild(knowledgeItem);
            });
        }

        function showKnowledgeDetail(point) {
            const container = document.getElementById('detailContent');
            container.innerHTML = `
                <div class="knowledge-item">
                    <div class="knowledge-item-header">
                        <span class="knowledge-item-type ${point.type === 'summary' ? 'type-summary' : point.type === 'tip' ? 'type-tip' : 'type-comparison'}">${point.type === 'summary' ? '总结' : point.type === 'tip' ? '技巧' : '对比'}</span>
                        <span class="knowledge-item-title">${point.title}</span>
                    </div>
                    <div class="knowledge-item-content">${point.content}</div>
                </div>
            `;
            openDetail();
        }

        function openDetail() {
            document.getElementById('detailPanel').classList.add('active');
        }

        function closeDetail() {
            document.getElementById('detailPanel').classList.remove('active');
        }

        function playVideo() {
            isPlaying = true;
            document.getElementById('playIcon').innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            if (isPlaying) {
                document.getElementById('playIcon').innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
            } else {
                document.getElementById('playIcon').innerHTML = '<path d="M8 5v14l11-7z"/>';
            }
        }

        function playPrev() {
            let totalLessons = 0;
            for (let i = 0; i <= currentChapter; i++) {
                totalLessons += courseData.chapters[i].lessons.length;
            }
            let currentTotal = totalLessons - courseData.chapters[currentChapter].lessons.length + currentLesson;
            
            if (currentTotal > 0) {
                currentTotal--;
                let chapterIndex = 0;
                let lessonIndex = 0;
                let count = 0;
                for (let i = 0; i < courseData.chapters.length; i++) {
                    if (count + courseData.chapters[i].lessons.length > currentTotal) {
                        chapterIndex = i;
                        lessonIndex = currentTotal - count;
                        break;
                    }
                    count += courseData.chapters[i].lessons.length;
                }
                selectLesson(chapterIndex, lessonIndex);
            }
        }

        function playNext() {
            let totalLessons = 0;
            for (let i = 0; i < courseData.chapters.length; i++) {
                totalLessons += courseData.chapters[i].lessons.length;
            }
            let currentTotal = 0;
            for (let i = 0; i < currentChapter; i++) {
                currentTotal += courseData.chapters[i].lessons.length;
            }
            currentTotal += currentLesson;
            
            if (currentTotal < totalLessons - 1) {
                currentTotal++;
                let chapterIndex = 0;
                let lessonIndex = 0;
                let count = 0;
                for (let i = 0; i < courseData.chapters.length; i++) {
                    if (count + courseData.chapters[i].lessons.length > currentTotal) {
                        chapterIndex = i;
                        lessonIndex = currentTotal - count;
                        break;
                    }
                    count += courseData.chapters[i].lessons.length;
                }
                selectLesson(chapterIndex, lessonIndex);
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        document.addEventListener('DOMContentLoaded', loadCourseData);
    </script>
</body>
</html>
